name: Update NOAA Tornado Data

on:
  schedule:
    # Runs at 00:00 on Sunday every week
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-csvs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Data Updater Script
        run: python python_helpers/update_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage all CSV updates in the root folder
          git add *.csv
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update NOAA tornado CSVs"
            git push
          else
            echo "No data changes detected."
          fi
